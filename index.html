<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kanshi · Seguimiento semanal</title>
  <meta name="description" content="Seguimiento semanal del desempeño de publicaciones de Mercado Libre." />
  <meta name="theme-color" content="#2a78d6" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%232a78d6'/><path d='M8 22l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=4" />
</head>
<body>
  <!-- Pantalla de ingreso (sólo con Supabase) -->
  <section class="auth-view" id="auth-view" hidden>
    <div class="auth-card card">
      <div class="brand auth-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" /><path d="M8 22l5-6 4 3 7-9" /></svg>
        </span>
        <div>
          <h1>Kanshi</h1>
          <p class="brand-sub">Seguimiento semanal · Mercado Libre</p>
        </div>
      </div>
      <div id="auth-body"></div>
    </div>
  </section>

  <div class="loading" id="loading" role="status">Cargando…</div>

  <div id="app-view" hidden>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" /><path d="M8 22l5-6 4 3 7-9" /></svg>
      </span>
      <div>
        <h1>Kanshi</h1>
        <p class="brand-sub">Seguimiento semanal · Mercado Libre</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" id="btn-export-xlsx" title="Exportar todo a Excel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z M4 9h16 M4 14h16 M10 4v16"/></svg>
        <span class="hide-sm">Excel</span>
      </button>
      <div class="menu">
        <button class="btn btn-ghost" id="btn-data-menu" aria-haspopup="true" aria-expanded="false" title="Copia de seguridad">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12 M7 10l5 5 5-5 M5 21h14"/></svg>
          <span class="hide-sm">Respaldo</span>
        </button>
        <div class="menu-panel" id="data-menu" hidden>
          <button class="menu-item" id="btn-backup">Descargar copia de seguridad</button>
          <button class="menu-item" id="btn-restore" data-edit>Restaurar copia de seguridad…</button>
          <button class="menu-item" id="btn-upload-local" data-edit hidden>Subir a la nube los datos de este navegador…</button>
          <input type="file" id="file-restore" accept="application/json,.json" hidden />
        </div>
      </div>
      <div class="menu" id="user-menu-wrap" hidden>
        <button class="btn btn-ghost user-btn" id="btn-user-menu" aria-haspopup="true" aria-expanded="false" title="Tu usuario">
          <span class="avatar" id="user-avatar" aria-hidden="true"></span>
          <span class="role-badge" id="user-role"></span>
        </button>
        <div class="menu-panel" id="user-menu" hidden>
          <div class="menu-info">
            <span class="menu-info-label">Conectado como</span>
            <strong id="user-email"></strong>
            <span class="muted" id="user-role-text"></span>
          </div>
          <button class="menu-item" id="btn-change-password">Cambiar contraseña</button>
          <button class="menu-item" id="btn-sign-out">Cerrar sesión</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Cuentas -->
    <section class="accounts" aria-label="Cuentas">
      <div class="segmented" id="account-tabs" role="tablist"></div>
      <button class="icon-btn" id="btn-rename-account" data-edit title="Renombrar cuenta" aria-label="Renombrar cuenta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z M14 6l4 4"/></svg>
      </button>
    </section>

    <!-- Publicaciones -->
    <nav class="post-tabs-wrap" aria-label="Publicaciones">
      <div class="post-tabs" id="post-tabs" role="tablist"></div>
      <button class="btn btn-soft btn-sm" id="btn-add-post" data-edit>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14 M5 12h14"/></svg>
        Nueva publicación
      </button>
    </nav>

    <div class="banner" id="upload-banner" data-edit hidden>
      <span>Encontramos datos guardados en este navegador que todavía no están en la nube.</span>
      <button class="btn btn-primary btn-sm" id="btn-upload-banner">Subirlos a la nube</button>
      <button class="icon-btn" id="btn-upload-dismiss" aria-label="Ocultar aviso" title="Ocultar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg>
      </button>
    </div>

    <section id="post-view"></section>
  </main>

  <footer class="footer">
    <span id="storage-status"></span>
  </footer>
  </div>

  <!-- Diálogo genérico -->
  <dialog id="dialog" class="dialog">
    <form method="dialog" id="dialog-form" novalidate>
      <header class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12 M18 6L6 18"/></svg>
        </button>
      </header>
      <div class="dialog-body" id="dialog-body"></div>
      <footer class="dialog-foot" id="dialog-foot"></footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
  <script src="js/config.js?v=4"></script>
  <script src="js/storage.js?v=4"></script>
  <script src="js/calc.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
